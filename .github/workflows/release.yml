# package.json 版本號一改並推上 main，就在 Windows 機器上打包安裝檔並發佈到 GitHub Releases（標籤 v版本號自動建立）
# 已安裝的 APP 會從這裡自動下載新版。也可以在 Actions 頁手動按 Run workflow。
name: release
on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node tests/unit.test.js
      - run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
